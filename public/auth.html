<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA - Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090b20;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 360px;
      padding: 35px;
      border-radius: 20px;
      background: #171b3a;
      box-shadow: 0 0 40px rgba(120, 80, 255, 0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 10px;
      background: #0d1028;
      color: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #7657ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🧠 AURA</h1>
    <div class="subtitle">Unified Revision Assistant</div>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="mainButton">Log In</button>

    <div class="switch" id="switchMode">
      Don't have an account? Create one
    </div>

    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://znpzkkjgvkrjikxjsmdi.supabase.co";

    const SUPABASE_KEY = "sb_publishable_e44X6o79H_9lj7m1FU7wAw_MfFCMRTd";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    let signupMode = false;

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const mainButton = document.getElementById("mainButton");
    const switchMode = document.getElementById("switchMode");
    const message = document.getElementById("message");

    switchMode.addEventListener("click", () => {
      signupMode = !signupMode;

      mainButton.textContent = signupMode ? "Create Account" : "Log In";

      switchMode.textContent = signupMode
        ? "Already have an account? Log in"
        : "Don't have an account? Create one";

      message.textContent = "";
    });

    mainButton.addEventListener("click", async () => {
      const userEmail = email.value.trim();
      const userPassword = password.value;

      if (!userEmail || !userPassword) {
        message.textContent = "Please enter your email and password.";
        return;
      }

      message.textContent = "Please wait...";

      if (signupMode) {
        const { error } = await client.auth.signUp({
          email: userEmail,
          password: userPassword
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        message.textContent =
          "Account created! Check your email to verify your account.";
      } else {
        const { error } = await client.auth.signInWithPassword({
          email: userEmail,
          password: userPassword
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

      window.location.href = "/dashboard";
      }
    });
  </script>

</body>
</html>
